name: Macos Executable Release
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Artifact Prefix'
        default: twilio
jobs:
  get-tag:
    runs-on: macos-x64
    outputs:
     TAG_NAME: ${{steps.get-tag.outputs.TAG_NAME}}
    steps:
     - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
     - name: Getting latest tag
       id: get-tag
       run: |
        git fetch --prune --unshallow
        echo "::set-output name=TAG_NAME::$(git describe --tags $(git rev-list --tags --max-count=1))"
  get-sha:
    runs-on: macos-x64
    outputs:
      SHA_SHORT: ${{steps.get-sha.outputs.SHA_SHORT}}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Getting short sha
        id: get-sha
        run: |
          git fetch --prune --unshallow
          echo "::set-output name=SHA_SHORT::$(git rev-parse --short HEAD)"
  pack-macos:
    needs: [get-tag, get-sha]
    runs-on: macos-x64
    env:
      FILE_PATH_X64: dist/macos/${{ github.event.inputs.formula }}-v${{ needs.get-tag.outputs.TAG_NAME }}.pkg
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    # Signing/notarization is best-effort: if it fails we still want the .pkg
    # to be built and attached to the release, just unsigned.
    - id: pack-sign
      continue-on-error: true
      run: source .github/scripts/pack_macos.sh
      env:
        OSX_INSTALLER_CERT_BASE64: ${{ secrets.OSX_INSTALLER_CERT_BASE64}}
        OSX_INSTALLER_CERT_PASSWORD: ${{ secrets.OSX_INSTALLER_CERT_PASSWORD}}
        APPLE_ID: ${{ secrets.APPLE_ID}}
        APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD}}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID}}
#        FILE_PATH_ARM64: dist/macos/${{ github.event.inputs.formula }}-v${{ needs.get-tag.outputs.TAG_NAME }}-${{ needs.get-sha.outputs.SHA_SHORT }}-arm64.pkg
        REPOSITORY_OWNER: ${{ github.repository_owner }}
    - name: Fall back to an unsigned package
      if: steps.pack-sign.outcome == 'failure'
      run: |
          echo "::warning title=macOS signing/notarization failed::Releasing an unsigned package. See the previous step's logs."
          echo ":warning: Signing/notarization failed - \`$FILE_PATH_X64\` is being released **unsigned and un-notarized**." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$FILE_PATH_X64" ]; then
            echo "Package already built, releasing it as is."
          else
            echo "Package missing, building it without signing."
            make install
            npx oclif-dev pack:macos
          fi
#    TODO: enable these when oclif pack : macos starts working fine

# Stage 3 of 3: publish the release that the release PR just landed, then fan
# out to oclif and the platform executable builds.
#
# Runs on the merge commit, which already contains the version in package.json
# and the notes in CHANGES.md. semantic-release therefore tags and publishes a
# commit that genuinely contains the version it claims, which is what makes the
# git tag and the npm provenance attestation trustworthy.
name: Cli Release Publish

on:
  workflow_call:
    inputs:
      homebrew-branch:
        type: string
        default: main
      homebrew-prerelease:
        type: string
        default: 'false'
    outputs:
      tag-name:
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  id-token: write
  contents: write

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  release:
    runs-on: ubuntu-x64
    outputs:
      tag-name: ${{ steps.semantic-release.outputs.TAG_NAME }}
      draft-tag-name: ${{ steps.semantic-release-draft.outputs.TAG_NAME }}
    steps:
      - name: Checkout cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Needed to find the previous tag and the release-prep commit.
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Run git and npm update
        run: |
          git pull
          make install
      - name: Check package.json still matches the version to be released
        run: |
          fileName="$GITHUB_WORKSPACE/.github/scripts/verify-release-version.js"
          node -e "require('$fileName').verifyReleaseVersion().catch(e => { console.error(e.message); process.exit(1); })"
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Recover the release inputs for the release notes
        id: release-inputs
        run: bash .github/scripts/release-inputs-for-publish.sh

      - name: Semantic Release runs
        id: semantic-release
        run: DEBUG=semantic-release:* npx semantic-release  -t \${version}
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true # required for OIDC
      - name: verify release required
        if: ${{steps.semantic-release.outputs.TAG_NAME == ''}}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        with:
          script: |
            core.setFailed('There are no relevant changes, so no new version is released.')

      - name: Update release
        run:
          node .github/scripts/update-release.js
        env:
          TAG_NAME: ${{steps.semantic-release.outputs.TAG_NAME}}
          RELEASE_BODY: ${{ steps.release-inputs.outputs.change-log }}
          REPO_NAME: ${{ github.repository }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUTS: '{ "tag-name": "${{ steps.semantic-release-draft.outputs.TAG_NAME }}" }'
          CLI_CORE_TAG: ${{ steps.release-inputs.outputs.cli-core-tag }}

  oclif-release:
    runs-on: ubuntu-x64
    needs: [release]
    steps:
      - name: Checkout cli repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          git pull
          make install
      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
      - name: Invoke Oclif workflow
        if: ${{needs.release.outputs.tag-name != '' && steps.extract_branch.outputs.branch == 'main'}}
        run: node .github/scripts/trigger-workflow.js
        env:
          WORKFLOW_NAME: 'oclif-release.yml'
          REPO_NAME: ${{ github.repository }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          BRANCH_NAME: ${{steps.extract_branch.outputs.branch}}
          INPUTS: '{ "home-brew-branch": "${{ inputs.homebrew-branch }}", "tag-name": "${{needs.release.outputs.tag-name}}", "pre-release": "${{ inputs.homebrew-prerelease }}"}'
      - name: Invoke Oclif workflow for release candidate
        if: ${{needs.release.outputs.tag-name != '' && steps.extract_branch.outputs.branch != 'main'}}
        run: node .github/scripts/trigger-workflow.js
        env:
          WORKFLOW_NAME: 'oclif-release.yml'
          REPO_NAME: ${{ github.repository }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          BRANCH_NAME: ${{steps.extract_branch.outputs.branch}}
          INPUTS: '{ "home-brew-branch": "${{ inputs.homebrew-branch }}", "tag-name": "${{needs.release.outputs.tag-name}}", "formula": "twiliorc", "pre-release": "${{ inputs.homebrew-prerelease }}"}'

  platform-executables-release:
    runs-on: ubuntu-x64
    needs: [ release ]
    env:
        REPO_NAME: ${{ github.repository }}
        REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
    strategy:
      matrix:
        executable_workflow: ['debian-executable-release.yml', 'macos-executable-release.yml', 'rpmbuild.yml', 'windows-executable-release.yml', 'apt-release.yml']
    steps:
      - name: Checkout cli repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: |
          git pull
          make install
      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
      - name: Invoke platform executable workflow
        if: ${{needs.release.outputs.tag-name != '' && steps.extract_branch.outputs.branch == 'main'}}
        run: node .github/scripts/trigger-workflow.js
        env:
          WORKFLOW_NAME: ${{ matrix.executable_workflow }}
          BRANCH_NAME: ${{steps.extract_branch.outputs.branch}}

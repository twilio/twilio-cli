name: Windows Executable Release
on:
  workflow_dispatch:
env:
  FORMULA_NAME: 'twilio'

jobs:
  get-sha:
    runs-on: macos-x64
    outputs:
      SHA_SHORT: ${{steps.get-sha.outputs.SHA_SHORT}}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Getting latest sha
        id: get-sha
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
  get-tag:
    runs-on: macos-x64
    outputs:
     TAG_NAME: ${{steps.get-tag.outputs.TAG_NAME}}
    steps:
     - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
     - name: Getting latest tag
       id: get-tag
       run: |
        git fetch --prune --unshallow
        echo "TAG_NAME=$(git describe --tags $(git rev-list --tags --max-count=1))" >> "$GITHUB_OUTPUT"
  pack-windows-release:
    runs-on: macos-x64
    needs: [get-tag, get-sha]
    steps:
     - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
     - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
       with:
        node-version: '22'
     - run: |
        make install
        brew install makensis
        npx oclif pack:win
     - name: upload artifact
       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
       with:
        name: ${{env.FORMULA_NAME}}-${{ needs.get-tag.outputs.TAG_NAME }}.exe
        path: dist/win32/${{env.FORMULA_NAME}}-v${{ needs.get-tag.outputs.TAG_NAME }}-${{ needs.get-sha.outputs.SHA_SHORT }}-x86.exe
        retention-days: 1

  sign-windows-release:
    needs: [pack-windows-release, get-tag, get-sha]
    runs-on: windows-latest-large
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: make install
      - name: import Executable
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{env.FORMULA_NAME}}-${{ needs.get-tag.outputs.TAG_NAME }}.exe
      - name: 'Echo download path'
        run: ls ${{steps.download.outputs.download-path}}

      - name: Setup Certificate
        env:
          P12PASS: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: |
          P12="${RUNNER_TEMP}/Certificate_pkcs12.p12"
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | tr -d '[:space:]' | base64 --decode > "$P12"
          echo "size: $(wc -c < "$P12") bytes"

          # Does the decoded container actually open with the password secret?
          # Only the verdict is printed, never the contents.
          if openssl pkcs12 -in "$P12" -nokeys -passin env:P12PASS >/dev/null 2>&1; then
            echo "p12 opens with SM_CLIENT_CERT_PASSWORD: YES"
          elif openssl pkcs12 -legacy -in "$P12" -nokeys -passin env:P12PASS >/dev/null 2>&1; then
            echo "p12 opens with SM_CLIENT_CERT_PASSWORD: YES (needs -legacy)"
          else
            echo "p12 opens with SM_CLIENT_CERT_PASSWORD: NO"
            echo "--- openssl error ---"
            openssl pkcs12 -in "$P12" -nokeys -passin env:P12PASS 2>&1 | head -5 || true
          fi
        shell: bash

      - name: Set variables
        id: variables
        run: |
          dir
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "KEYPAIR_NAME=gt-standard-keypair" >> "$GITHUB_OUTPUT"
          echo "CERTIFICATE_NAME=gt-certificate" >> "$GITHUB_OUTPUT"
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=${{ runner.temp }}\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> $GITHUB_PATH
        shell: bash

      - name: Code signing with Software Trust Manager
        id: SSMClientToolSetup
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        env:
          SM_API_KEY: ${{ env.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.SM_CLIENT_CERT_PASSWORD }}
          SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}

      - name: Setup Keylocker KSP on windows
        run: |
          curl -X GET  https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download -H "x-api-key:%SM_API_KEY%" -o Keylockertools-windows-x64.msi
          msiexec /i Keylockertools-windows-x64.msi /quiet /qn
          smksp_registrar.exe list
          smctl.exe keypair ls
          C:\Windows\System32\certutil.exe -csp "DigiCert Signing Manager KSP" -key -user
        shell: cmd

      # The KSP that signtool loads is a separate component from smctl and may
      # read credentials from DigiCert's credential store rather than the
      # environment. REST hash-signing with these same credentials succeeds,
      # so the credentials are good - they may just not reach the KSP.
      - name: Save credentials for the KSP
        continue-on-error: true
        shell: cmd
        run: |
          smctl credentials save %SM_API_KEY% %SM_CLIENT_CERT_PASSWORD%

      - name: Keylocker healthcheck
        run: |
          smctl healthcheck
          smctl keypair ls
        shell: cmd
        continue-on-error: true

      - name: List certificates in DigiCert ONE
        run: |
          smctl certificate ls
        shell: cmd

      - name: Certificates Sync
        run: |
          smctl windows certsync
        shell: cmd

      - name: List certificates in DigiCert ONE
        run: |
          smctl certificate ls
        shell: cmd

      # find signtool.exe dynamically
      - name: Find signtool.exe
        id: find_signtool
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Windows Kits\10\bin"

          # Prefer x64 signtool: the DigiCert Keylocker KSP is x64-only, and a
          # 32-bit signtool cannot load it (SignerSign() fails with NTE_FAIL).
          $signtool = Get-ChildItem $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          # If no x64, fall back to x86
          if (-not $signtool) {
            $signtool = Get-ChildItem $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x86\\' } |
              Sort-Object FullName |
              Select-Object -First 1
          }

          # As a last resort, any signtool (but avoid arm64 if possible)
          if (-not $signtool) {
            $signtool = Get-ChildItem $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\arm64\\' } |
              Sort-Object FullName |
              Select-Object -First 1
          }

          if (-not $signtool) {
            Write-Error "signtool.exe not found under '$root'"
            exit 1
          }

          Write-Host "Found signtool at $($signtool.FullName)"
          "path=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Diagnostic: DigiCert's own signer reports real errors, unlike
      # signtool's opaque NTE_FAIL. Non-fatal so signtool still runs.
      - name: Sign with smctl (diagnostic)
        if: ${{ github.repository_owner == 'twilio' }}
        continue-on-error: true
        shell: cmd
        run: |
          smctl sign --verbose --keypair-alias=key_1446579873 --input "${{ steps.download.outputs.download-path }}\${{ env.FORMULA_NAME }}-v${{ needs.get-tag.outputs.TAG_NAME }}-${{ needs.get-sha.outputs.SHA_SHORT }}-x86.exe"

      - name: Code Sign The Executable
        if: ${{ github.repository_owner == 'twilio' }}
        shell: pwsh
        run: |
          $signtool = '${{ steps.find_signtool.outputs.path }}'
          & $signtool sign `
            /v /debug `
            /sha1 '${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}' `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            /fd SHA256 `
            '${{ steps.download.outputs.download-path }}\${{ env.FORMULA_NAME }}-v${{ needs.get-tag.outputs.TAG_NAME }}-${{ needs.get-sha.outputs.SHA_SHORT }}-x86.exe'

      - name: Upload binaries to release
        run: node .github/scripts/update-platform-executables.js
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         FILE: ${{steps.download.outputs.download-path}}\${{env.FORMULA_NAME}}-v${{ needs.get-tag.outputs.TAG_NAME }}-${{ needs.get-sha.outputs.SHA_SHORT }}-x86.exe
         ASSET_NAME: ${{env.FORMULA_NAME}}-${{ needs.get-tag.outputs.TAG_NAME }}.exe
         TAG_NAME: ${{ needs.get-tag.outputs.TAG_NAME }}
         REPO_NAME: ${{ github.repository }}


name: Cli Release
on:
  workflow_dispatch:
    inputs:
      change-log:
        description: 'Open API Changelog.'
      version-type:
        description: 'Version to upgrade, Major: 0, Minor:1, Patch: 2'
      homebrew-branch:
        description: 'HomeBrew branch name'
        default: main
      homebrew-prerelease:
        description: 'HomeBrew prerelease'
        default: 'false'
      tag-name:
        description: 'The @twilio/cli-core version to depend on, e.g. 8.3.4 (not the twilio-cli version)'
        required: true

permissions:
  id-token: write  # Required for OIDC
  contents: write

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [ 22.x, lts/* ]
    steps:
      - name: Checkout cli repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@23b656b843d2a3461cf38e4fd466c07a822d5fc0 # v1
      - run: make install
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Run tests
        run: npm test
  update-api-definitions-changelog:
    runs-on: ubuntu-x64
    needs: [test]
    outputs:
      prep-pr-opened: ${{ steps.prep.outputs.prep-pr-opened }}
    steps:
      - name: Checkout cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Update Changelog
        id: prep
        # Inputs are passed through env, not interpolated into the command, so
        # a value containing shell metacharacters cannot inject commands into
        # this step (which holds GH_TOKEN).
        run: |
          bash .github/scripts/commit-api-spec-change-log.sh "$CHANGE_LOG" "$VERSION_TYPE"
        env:
          CHANGE_LOG: ${{ github.event.inputs.change-log }}
          VERSION_TYPE: ${{ github.event.inputs.version-type }}
          CLI_CORE_TAG: ${{ github.event.inputs.tag-name }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
  # When there was nothing new to prepare, main is already up to date and we go
  # straight to preparing the release PR. When a prep PR *was* opened, that
  # happens instead from release-on-prep-merge.yml once the prep PR merges.
  prepare-release:
    needs: [ update-api-definitions-changelog ]
    if: needs.update-api-definitions-changelog.outputs.prep-pr-opened == 'false'
    uses: ./.github/workflows/release-prepare.yml
    secrets: inherit
    with:
      change-log: ${{ github.event.inputs.change-log }}

  summarize:
    needs: [ update-api-definitions-changelog ]
    if: needs.update-api-definitions-changelog.outputs.prep-pr-opened == 'true'
    runs-on: ubuntu-x64
    steps:
      - name: Explain what happens next
        run: |
          {
            echo "### Release prep PR opened"
            echo
            echo "The branch ruleset on \`main\` requires changes to go through a pull request,"
            echo "so the changelog and cli-core version bump were proposed as a PR instead of pushed."
            echo
            echo "**The release has not run yet.** Approve and merge that PR and the"
            echo "\`Cli Release On Prep Merge\` workflow will open the release PR."
          } >> "$GITHUB_STEP_SUMMARY"

